name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-api:
    name: API Tests (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: procuresight
          POSTGRES_USER: procure
          POSTGRES_PASSWORD: procure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procure -d procuresight"
          --health-interval 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt pytest

      - name: Run tests
        run: pytest apps/api/tests/
        env:
          DATABASE_URL: postgresql://procure:procure@localhost:5432/procuresight
          # DATABASE_APP_URL is required by Settings; this CI DB is not seeded with
          # the non-superuser app_user role, so it points at the same URL just to
          # let the app import. RLS-dependent tests skip without a seeded DB.
          DATABASE_APP_URL: postgresql://procure:procure@localhost:5432/procuresight
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: procuresight
          REDIS_URL: redis://localhost:6379

  test-web:
    name: Web Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm web:test

  build-web:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: test-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm --filter ./apps/web build
        env:
          NEXTAUTH_SECRET: ci-placeholder
          NEXTAUTH_URL: http://localhost:3000

